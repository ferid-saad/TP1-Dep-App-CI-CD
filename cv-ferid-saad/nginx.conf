server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas révéler la version de Nginx
    server_tokens off;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache pour les fichiers statiques
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    